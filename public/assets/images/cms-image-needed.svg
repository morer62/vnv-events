  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="72" y="72" width="1056" height="656" rx="42" fill="#ffffff" opacity="0.72" stroke="#d8dee6" stroke-width="3" stroke-dasharray="18 18"/>
